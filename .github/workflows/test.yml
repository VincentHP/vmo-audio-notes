name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild plugin
        run: node build.js
      - name: Verify committed bundle
        run: git diff --exit-code -- main.js
      - name: Run tests
        run: node --test test.js
